# Runs a released image: built by .github/workflows/build-image.yml on a vX.Y.Z tag,
# pulled by deploy.sh, which also writes the tag it deployed into `.env` as
# APP_IMAGE_TAG. A plain `docker compose up -d` here then keeps running that release.
# Without it the tag is `dev`: a local build (docker-compose.build.yml), never a release.
services:
  upload-server:
    image: "${APP_IMAGE:-ghcr.io/marianmeres/static-upload-server}:${APP_IMAGE_TAG:-dev}"
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "127.0.0.1:${PORT:-9090}:8000"
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${CONFIG_DIR:-./config}:/config
    environment:
      - PORT=8000
      - STATIC_DIR=/data
      - CONFIG_DIR=/config
      - ENABLE_UPLOAD_FORM=${ENABLE_UPLOAD_FORM:-true}
      - JWT_SECRET=${JWT_SECRET:-}
      - GLOBAL_TOKEN=${GLOBAL_TOKEN:-}
      # Structured logs on by default — without them, request errors
      # (including unhandled 500s) leave no trace in `docker compose logs`.
      - LOG=${LOG:-true}
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-}
      - UPLOAD_IDLE_TIMEOUT_MS=${UPLOAD_IDLE_TIMEOUT_MS:-}
      - CDN_PROVIDER=${CDN_PROVIDER:-}
      - CDN_CACHE_PURGE_URL_PREFIX=${CDN_CACHE_PURGE_URL_PREFIX:-}
      - CDN_CACHE_MAX_AGE=${CDN_CACHE_MAX_AGE:-}
      - CDN_CACHE_S_MAXAGE=${CDN_CACHE_S_MAXAGE:-}
      - CDN_STALE_WHILE_REVALIDATE=${CDN_STALE_WHILE_REVALIDATE:-}
      - CF_ZONE_ID=${CF_ZONE_ID:-}
      - CF_API_TOKEN=${CF_API_TOKEN:-}
    restart: unless-stopped
    container_name: static-upload-server
